version: 1
frontend:
  phases:
    preBuild:
      commands:
        # ── Install bun ────────────────────────────────────────────────────────
        - curl -fsSL https://bun.sh/install | bash
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        - bun --version

        # ── Install dependencies ───────────────────────────────────────────────
        - bun install --frozen-lockfile

        # ── Write .env.production ──────────────────────────────────────────────
        - |
          cat >> .env.production <<ENV
          NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL
          NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
          NEXT_PUBLIC_CDN_URL=$NEXT_PUBLIC_CDN_URL
          NEXT_PUBLIC_USER_POOL_ID=$NEXT_PUBLIC_USER_POOL_ID
          NEXT_PUBLIC_USER_POOL_CLIENT_ID=$NEXT_PUBLIC_USER_POOL_CLIENT_ID
          ENV

        # ── Sync S3 content/ → src/content/ ───────────────────────────────────
        - mkdir -p src/content
        - aws s3 sync s3://$S3_BUCKET_NAME/content src/content --delete --region $REGION

    build:
      commands:
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        - bun run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - .next/cache/**/*
      - ~/.bun/install/cache/**/*
